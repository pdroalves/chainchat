# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        working-directory: packages/nextjs
        env:
          NEXT_PUBLIC_IPFS_BUILD: "true"
          NEXT_PUBLIC_IGNORE_BUILD_ERROR: "true"
          NEXT_PUBLIC_BASE_PATH: "/chainchat"
          NEXT_PUBLIC_FACTORY_ADDRESS_LOCALHOST: ${{ vars.NEXT_PUBLIC_FACTORY_ADDRESS_LOCALHOST || '0x708A2Ea0D218043b10455c19D22954a918A059B2' }}
          NEXT_PUBLIC_FACTORY_ADDRESS_SEPOLIA: ${{ secrets.NEXT_PUBLIC_FACTORY_ADDRESS_SEPOLIA || '0xf88F5DeA343ff2eC7aecA37A085A29c0F65Ab010' }}
          NEXT_PUBLIC_FACTORY_ADDRESS: ${{ secrets.NEXT_PUBLIC_FACTORY_ADDRESS_SEPOLIA || '0xf88F5DeA343ff2eC7aecA37A085A29c0F65Ab010' }}
          NEXT_PUBLIC_ALCHEMY_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY || '' }}
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID || '' }}
        run: pnpm build

      - name: Add .nojekyll file
        run: touch packages/nextjs/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/nextjs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

